name: CI

# Required status checks gating merges (Constitution II & Quality Standards):
# build, Android Lint, detekt/ktlint, and the full unit test suite with coverage.
on:
  push:
    branches: [main, "001-*"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests + coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --no-daemon

      - name: detekt (static analysis)
        run: |
          curl -sSLO https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7.zip
          unzip -q detekt-cli-1.23.7.zip
          ./detekt-cli-1.23.7/bin/detekt-cli \
            --config config/detekt/detekt.yml \
            --input app/src/main/java \
            --build-upon-default-config

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: app/build/reports/coverage/**

  # Instrumented tests (camera/NFC/navigation) require a device/emulator and are run on the
  # designated reference device or a managed-device lane, not on the default CI runner.
  #
  # Coverage: the unit report above must show >= 80% on changed code, with explicit success AND
  # denial-path tests (Constitution Principle II).
